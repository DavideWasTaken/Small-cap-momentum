data:
  provider: yfinance
  interval: 15m
  period: 60d
  prepost: true
  timezone: America/New_York
  regular_start: "09:30"
  regular_end: "16:00"
  cache_dir: data/raw
  refresh: false

strategy:
  include_extended_setup: false

output:
  output_dir: outputs/multi_regular_only
  save_trade_charts: true
  chart_bars_before: 60
  chart_bars_after: 24
